# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: FAIR Metadata

on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
        description: The plugin slug
      did:
        required: true
        type: string
        description: The plugin DID
      fair-path:
        required: true
        type: string
        description: Relative path to FAIR metadata file
      version:
        required: true
        type: string
        description: The version number of the release
      use-develop:
        required: false
        type: boolean
        default: false
        description: Use the develop branch and extract the plugin zip. Set to true for production use.
    secrets:
      FAIR_VERIFICATION_KEY:
        required: true

permissions: {}

jobs:
  fair-metadata:
    name: FAIR Metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # Required to push the new branch
      pull-requests: write   # Required to create the pull request
    steps:

    - name: Checkout base branch
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        ref: ${{ inputs.use-develop && 'develop' || github.ref }}
        persist-credentials: true # Required for pushing the new branch

    - name: Download plugin zip
      env:
        PLUGIN_SLUG: ${{ inputs.plugin }}
        VERSION: ${{ inputs.version }}
      run: | #shell
        curl -fsSL -o "${PLUGIN_SLUG}.zip" "https://downloads.wordpress.org/plugin/${PLUGIN_SLUG}.${VERSION}.zip"

    - name: Extract plugin zip
      if: ${{ inputs.use-develop }}
      env:
        PLUGIN_SLUG: ${{ inputs.plugin }}
      run: | #shell
        unzip -q -o -j "${PLUGIN_SLUG}.zip" # -o overwrites, -j extracts without directory structure

    - name: Generate FAIR metadata
      env:
        PLUGIN_SLUG: ${{ inputs.plugin }}
        PLUGIN_DID: ${{ inputs.did }}
        FAIR_PATH: ${{ inputs.fair-path }}
        FAIR_VERIFICATION_KEY: ${{ secrets.FAIR_VERIFICATION_KEY }}
      run: | #shell
        npm install -g fair-tools

        fair-tools metadata build \
          --plugin-file "${PLUGIN_SLUG}.php" \
          --zip-file "${PLUGIN_SLUG}.zip" \
          --url "https://downloads.wordpress.org/plugin/${PLUGIN_SLUG}.${VERSION}.zip" \
          --did "${PLUGIN_DID}" \
          --metadata-file "${FAIR_PATH}" \
          --output-file "${FAIR_PATH}" \
          --assets-dir ".wordpress-org" \
          --assets-url "https://ps.w.org/${PLUGIN_SLUG}/assets/"

    - name: Create PR with updated FAIR metadata
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FAIR_PATH: ${{ inputs.fair-path }}
        VERSION: ${{ inputs.version }}
        PR_BASE: ${{ inputs.use-develop && 'develop' || github.ref_name }}
      run: | #shell
        BRANCH_NAME="fair-metadata-${VERSION}"

        git status
        git diff

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "${BRANCH_NAME}"
        git add "${FAIR_PATH}"
        git commit -m "Update FAIR metadata for ${VERSION}"
        git push origin "${BRANCH_NAME}"

        gh pr create \
          --title "Update FAIR metadata for ${VERSION}" \
          --body "Updates the FAIR metadata file following the ${VERSION} release." \
          --base "${PR_BASE}" \
          --head "${BRANCH_NAME}"
