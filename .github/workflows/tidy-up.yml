# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Tidy up
on:
  pull_request:
    types: [ closed ]
  workflow_dispatch:
    inputs:
      PR_NUMBER:
        description: The PR number to tidy up
        required: true

permissions: {}

jobs:
  close:
    name: Close PRs
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'johnbillion/plugin-infrastructure' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.inputs.PR_NUMBER }}
        with:
          retries: 2
          script: | #js
            const pr = await github.rest.pulls.get({
              owner: 'johnbillion',
              repo: 'plugin-infrastructure',
              pull_number: process.env.SOURCE_PR_NUMBER,
            });
            const labels = pr.data.labels.map(label => label.name);

            for (const label of labels) {
              // label is in the format "pr:{repo}:{pr_number}", i.e. "pr:query-monitor:123"
              const [_, repo, pr_number] = label.split(':');

              if (!pr_number) {
                continue;
              }

              // Close the plugin PR
              const pr = await github.rest.pulls.update({
                owner: 'johnbillion',
                repo: repo,
                pull_number: pr_number,
                state: 'closed',
              });

              // Delete the label
              await github.rest.issues.deleteLabel({
                owner: 'johnbillion',
                repo: 'plugin-infrastructure',
                name: label,
              });

              // Delete the branch for the plugin PR
              await github.rest.git.deleteRef({
                owner: 'johnbillion',
                repo: repo,
                ref: `heads/${pr.data.head.ref}`,
              });
            }

            // Delete the -built branch from plugin-infrastructure
            try {
              await github.rest.git.deleteRef({
                owner: 'johnbillion',
                repo: 'plugin-infrastructure',
                ref: `heads/${pr.data.head.ref}-built`,
              });
            } catch (error) {
              console.log(`No -built branch to delete: ${error.message}`);
            }
          github-token: ${{ secrets.PLUGINS_PUSH_TOKEN }}
