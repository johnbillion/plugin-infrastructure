# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Tag
on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
        description: The plugin slug
      readme:
        required: true
        type: string
        description: The plugin readme file name, either readme.md or readme.txt
      deploy:
        required: true
        type: boolean
        description: Whether to deploy the release to WordPress.org
      version:
        required: true
        type: string
        description: The version number of the release
      username:
        required: true
        type: string
        description: The WordPress.org SVN username
    secrets:
      WPORG_SVN_PASSWORD:
        required: true
    outputs:
      zip-path:
        description: The path to the generated zip file
        value: ${{ jobs.wordpress.outputs.zip-path }}
      version:
        description: The version number of the release
        value: ${{ inputs.version }}

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    runs-on: ubuntu-24.04
    permissions:
      attestations: write # Required to store the build provenance attestation
      contents: read      # Required to clone the repo.
      id-token: write     # Required for creating an OIDC token for build provenance attestation
    timeout-minutes: 70
    outputs:
      zip-path: ${{ steps.deploy.outputs.zip-path }}
    environment:
      name: WordPress.org
      url: "https://wordpress.org/plugins/${{ inputs.plugin }}/"
    steps:

    - name: Populate Changelog
      uses: johnbillion/action-changelog@trunk
      id: changelog
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        ref: ${{ inputs.version }}
        persist-credentials: false

    - name: Update Readme
      run: | #shell
        echo "${CHANGELOG}" >> "${README}"
      env:
        CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        README: ${{ inputs.readme }}

    - name: Commit Changelog
      run: | #shell
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add "${README}"
        git commit -m "Readme"
      env:
        README: ${{ inputs.readme }}

    - name: Install SVN
      run: | #shell
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get install -y --no-install-recommends subversion
        svn --version

    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      id: deploy
      env:
        SVN_USERNAME: ${{ inputs.username }}
        SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        VERSION: ${{ inputs.version }}
      with:
        dry-run: ${{ ! inputs.deploy }}
        generate-zip: true

    - name: Upload zip
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: deployed-${{ inputs.plugin }}-${{ inputs.version }}
        path: ${{ steps.deploy.outputs.zip-path }}
        if-no-files-found: error

    - name: Generate build provenance attestation
      if: ${{ inputs.deploy }}
      uses: johnbillion/action-wordpress-plugin-attestation@b749ddf48d76c82d31a12c8ef336bd76af0a901b # 0.7.1
      with:
        plugin: ${{ inputs.plugin }}
        version: ${{ inputs.version }}
        zip-path: ${{ steps.deploy.outputs.zip-path }}

  github:
    name: GitHub Milestones
    if: ${{ inputs.deploy }}
    permissions:
      issues: write # Required for write access to milestones
    uses: ./.github/workflows/reusable-milestones.yml
    with:
      version: ${{ inputs.version }}
