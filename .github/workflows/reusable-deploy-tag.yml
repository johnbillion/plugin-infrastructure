# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Tag
on:
  workflow_call:
    inputs:
      plugin:
        required: true
        type: string
        description: The plugin slug
      did:
        required: true
        type: string
        description: The plugin DID
      fair-path:
        required: true
        type: string
        description: Relative path to FAIR metadata file
      readme:
        required: true
        type: string
        description: The plugin readme file name, either readme.md or readme.txt
      deploy:
        required: true
        type: boolean
        description: Whether to deploy the release to WordPress.org
      version:
        required: true
        type: string
        description: The version number of the release
      username:
        required: true
        type: string
        description: The WordPress.org SVN username
    secrets:
      WPORG_SVN_PASSWORD:
        required: true
      FAIR_VERIFICATION_KEY:
        required: true
    outputs:
      zip-path:
        description: The path to the generated zip file
        value: ${{ jobs.wordpress.outputs.zip-path }}
      version:
        description: The version number of the release
        value: ${{ inputs.version }}

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    runs-on: ubuntu-24.04
    permissions:
      id-token: write       # Required for creating an OIDC token for build provenance attestation
      attestations: write   # Required to store the build provenance attestation
      contents: write       # Required to push the new branch
      pull-requests: write  # Required to create the pull request
    timeout-minutes: 70
    outputs:
      zip-path: ${{ steps.deploy.outputs.zip-path }}
    environment:
      name: WordPress.org
      url: "https://wordpress.org/plugins/${{ inputs.plugin }}/"
    steps:

    - name: Populate Changelog
      uses: johnbillion/action-changelog@trunk
      id: changelog
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout repository
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        ref: ${{ inputs.version }}
        persist-credentials: false

    - name: Update Readme
      run: | #shell
        echo "${CHANGELOG}" >> "${README}"
      env:
        CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        README: ${{ inputs.readme }}

    - name: Commit Changelog
      run: | #shell
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${README}"
        git commit -m "Readme"
      env:
        README: ${{ inputs.readme }}

    - name: Install SVN
      run: | #shell
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get install -y --no-install-recommends subversion
        svn --version

    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      id: deploy
      env:
        SVN_USERNAME: ${{ inputs.username }}
        SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        VERSION: ${{ inputs.version }}
      with:
        dry-run: ${{ ! inputs.deploy }}
        generate-zip: true

    - name: Upload zip
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: deployed-${{ inputs.plugin }}-${{ inputs.version }}
        path: ${{ steps.deploy.outputs.zip-path }}
        if-no-files-found: error

    - name: Generate build provenance attestation
      if: ${{ inputs.deploy }}
      uses: johnbillion/action-wordpress-plugin-attestation@b749ddf48d76c82d31a12c8ef336bd76af0a901b # 0.7.1
      with:
        plugin: ${{ inputs.plugin }}
        version: ${{ inputs.version }}
        zip-path: ${{ steps.deploy.outputs.zip-path }}

    - name: Generate FAIR metadata
      env:
        PLUGIN_SLUG: ${{ inputs.plugin }}
        PLUGIN_DID: ${{ inputs.did }}
        VERSION: ${{ inputs.version }}
        FAIR_PATH: ${{ inputs.fair-path }}
        FAIR_VERIFICATION_KEY: ${{ secrets.FAIR_VERIFICATION_KEY }}
      run: | #shell
        npm install -g fair-tools

        fair-tools metadata build \
          --plugin-file "${PLUGIN_SLUG}.php" \
          --zip-file "${PLUGIN_SLUG}.zip" \
          --url "https://downloads.wordpress.org/plugin/${PLUGIN_SLUG}.${VERSION}.zip" \
          --did "${PLUGIN_DID}" \
          --metadata-file "${FAIR_PATH}" \
          --output-file "${FAIR_PATH}" \
          --assets-dir ".wordpress-org" \
          --assets-url "https://ps.w.org/${PLUGIN_SLUG}/assets/"

    - name: Checkout base branch for PR
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: pr-branch
        persist-credentials: true # Required for pushing the new branch

    - name: Create PR with updated FAIR metadata
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FAIR_PATH: ${{ inputs.fair-path }}
        VERSION: ${{ inputs.version }}
      run: | #shell
        BRANCH_NAME="fair-metadata-${VERSION}"

        # Copy the updated FAIR metadata to the PR branch checkout
        cp "${FAIR_PATH}" "pr-branch/${FAIR_PATH}"

        cd pr-branch

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "${BRANCH_NAME}"
        git add "${FAIR_PATH}"
        git commit -m "Update FAIR metadata for ${VERSION}"
        git push origin "${BRANCH_NAME}"

        gh pr create \
          --title "Update FAIR metadata for ${VERSION}" \
          --body "Updates the FAIR metadata file following the ${VERSION} release." \
          --head "${BRANCH_NAME}"

  github:
    name: GitHub Milestones
    if: ${{ inputs.deploy }}
    permissions:
      issues: write # Required for write access to milestones
    uses: ./.github/workflows/reusable-milestones.yml
    with:
      version: ${{ inputs.version }}
