# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Coding Standards
on:
  workflow_call:
    inputs:
      php:
        required: true
        type: string
        description: PHP version to use in major.minor format (e.g. 8.0)

permissions: {}

jobs:
  phpcs:
    name: ${{ inputs.php }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      LOCAL_PHP: ${{ inputs.php }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure environment variables
      run: | #shell
        echo COMPOSER_CACHE_DIR="${RUNNER_TEMP}/composer-cache" >> "$GITHUB_ENV"
        echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "$GITHUB_PATH"

    # PHPCS runs in a container. PHP on the host is only needed for cs2pr.
    - name: Install PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.php }}
        tools: cs2pr
        coverage: none
      env:
        fail-fast: true

    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: npm

    - name: Install node dependencies
      run: npm ci --no-audit --no-fund --ignore-scripts

    - name: Composer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.json') }}

    - name: PHPCS cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/cache/phpcs.json
        key: phpcs-${{ inputs.php }}-${{ hashFiles('composer.json') }}-${{ hashFiles('phpcs.xml.dist') }}

    - name: Debugging
      run: tests-composer --version

    - name: Composer validate
      run: tests-composer validate --strict --no-check-lock

    - name: Install dependencies
      run: tests-composer install

    - name: Create PHPCS cache directory
      run: mkdir --parents tests/cache

    - name: Run code sniffer
      run: tests-composer run test:phpcs -- --report-checkstyle=./tests/cache/phpcs-report.xml
      id: phpcs

    - name: Show PHPCS results in PR
      if: ${{ always() && steps.phpcs.outcome == 'failure' }}
      run: cs2pr ./tests/cache/phpcs-report.xml || true
