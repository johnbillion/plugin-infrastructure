# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Test Plugins
on:
  pull_request:

permissions: {}

jobs:
  build-branch:
    name: Build test branch
    if: github.event.pull_request.head.repo.full_name == 'johnbillion/plugin-infrastructure'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: | #shell
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Build package
        run: | #shell
          npm run build

      - name: Create and push built branch
        run: | #shell
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${GITHUB_HEAD_REF}-built"
          git add -f dist/
          git commit -m "Built assets for testing"
          git push origin "${GITHUB_HEAD_REF}-built" --force

  open-pr:
    name: Open PR / ${{ matrix.plugin }}
    permissions:
      pull-requests: write
    needs:
      - build-branch
    strategy:
      matrix:
        plugin:
          - query-monitor
          - user-switching
          - wp-crontrol
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: johnbillion/${{ matrix.plugin }}
          token: ${{ secrets.PLUGINS_PUSH_TOKEN }}
          persist-credentials: false

      - name: Update workflow files
        run: | #shell
          find .github/workflows -name '*.yml' -type f -exec sed -i "s|johnbillion/plugin-infrastructure/\.github/workflows/\([^@]*\)@.*$|johnbillion/plugin-infrastructure/.github/workflows/\1@${GITHUB_SHA}|g" {} \;

      - name: Update Composer dependencies
        if: hashFiles('composer.json') != ''
        run: | #shell
          sed -i "s|\"johnbillion/plugin-infrastructure\": \"[^\"]*\"|\"johnbillion/plugin-infrastructure\": \"dev-${GITHUB_HEAD_REF}-built\"|g" composer.json

      - name: Setup node
        if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Update Node dependencies
        if: hashFiles('package.json') != ''
        run: | #shell
          npm install "@johnbillion/plugin-infrastructure@github:johnbillion/plugin-infrastructure#${GITHUB_HEAD_REF}-built" --save-exact --save-dev --package-lock-only

      - name: Check the changed files
        run: | #shell
          git diff --color
          git status

      - name: Open PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        id: cpr
        with:
          token: ${{ secrets.PLUGINS_PUSH_TOKEN }}
          commit-message: Update Plugin Infrastructure to ${{ github.event.pull_request.head.sha }}
          title: Test with plugin-infrastructure@${{ github.event.pull_request.head.ref }}
          body: | #markdown
            This PR switches plugin-infrastructure to https://github.com/johnbillion/plugin-infrastructure/tree/${{ github.event.pull_request.head.ref }}-built for testing purposes. This PR should not be merged.

            See https://github.com/johnbillion/plugin-infrastructure/pull/${{ github.event.pull_request.number }} for more details.

            This is an automated PR created by [the Test Plugins workflow](https://github.com/johnbillion/plugin-infrastructure/actions/workflows/test-plugins.yml).
          branch: test-plugin-infrastructure/${{ github.event.pull_request.head.ref }}
          draft: true

      - name: Set labels
        run: | #shell
          gh --repo johnbillion/plugin-infrastructure label create "pr:${PLUGIN}:${PLUGIN_PR_NUMBER}" --force --color F4F4F4
          gh --repo johnbillion/plugin-infrastructure pr edit "${SOURCE_PR_NUMBER}" --add-label "pr:${PLUGIN}:${PLUGIN_PR_NUMBER}"
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          PLUGIN: ${{ matrix.plugin }}
          PLUGIN_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
