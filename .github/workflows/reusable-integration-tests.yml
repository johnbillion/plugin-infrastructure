# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Integration Tests
on:
  workflow_call:
    inputs:
      wp:
        required: true
        type: string
        description: WordPress version to use in major.minor format (e.g. 6.4), or "latest" or "nightly"
      php:
        required: true
        type: string
        description: PHP version to use in major.minor format (e.g. 8.0)
      cache:
        required: false
        type: boolean
        description: Whether to cache package dependencies
        default: true

permissions: {}

jobs:
  integration:
    name: PHP ${{ inputs.php }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      LOCAL_PHP: ${{ inputs.php }}
      LOCAL_WP_DEBUG: ${{ inputs.php < 8.1 && 1 || 0 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure environment variables
      run: | #shell
        PLUGIN_SLUG="$(jq -r .name package.json)"
        {
          echo PHP_FPM_UID="$(id -u)"
          echo PHP_FPM_GID="$(id -g)"
          echo PLUGIN_SLUG="${PLUGIN_SLUG}"
          echo COMPOSE_PROJECT_NAME="${PLUGIN_SLUG}"
          echo COMPOSER_CACHE_DIR="${RUNNER_TEMP}/composer-cache"
        } >> "$GITHUB_ENV"
        echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.cache && 'npm' || '' }}

    - name: Install node dependencies
      run: npm ci --no-audit --no-fund --ignore-scripts

    - name: Composer cache
      if: ${{ inputs.cache }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/composer-cache
        key: composer-${{ inputs.php }}-${{ hashFiles('composer.json') }}

    - name: Install Composer dependencies
      run: | #shell
        if [ "${WP_VERSION}" == "latest" ]; then
          tests-composer install --dev
        elif [ "${WP_VERSION}" == "nightly" ]; then
          tests-composer require --dev --update-with-dependencies roots/wordpress-full="dev-main"
        elif [[ "${WP_VERSION}" =~ ^[0-9]\.[0-9]$ ]]; then
          tests-composer require --dev --update-with-dependencies roots/wordpress-full="~${WP_VERSION}.0" wp-phpunit/wp-phpunit="~${WP_VERSION}.0"
        else
          tests-composer require --dev --update-with-dependencies roots/wordpress-full="${WP_VERSION}"
        fi
      env:
        WP_VERSION: ${{ inputs.wp }}

    - name: Start Docker environment
      run: tests-start php

    - name: Debugging
      run: | #shell
        echo "=== Docker ==="
        docker --version
        docker compose version
        docker compose ps
        echo "=== PHP ==="
        docker compose exec php php --version
        docker compose exec php php -m
        echo "=== Database ==="
        docker compose exec database mariadb --version

    - name: Run integration tests
      run: npm run test:integration
