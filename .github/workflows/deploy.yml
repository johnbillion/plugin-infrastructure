# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Publish

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@johnbillion/plugin-infrastructure
    timeout-minutes: 10
    permissions:
      contents: read  # Required to clone the repository
      id-token: write # Required for creating an OIDC token so `npm publish` can:
                      # 1. Authenticate with npm for OIDC trusted publishing
                      # 2. Obtain a signing certificate from Sigstore for its provenance attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish via OIDC trusted publishing
        run: | #shell
          if [[ "$GITHUB_REF_NAME" == *"-"* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
